# A ogni PR verso main: il controllo del catalogo, le prove dei calcoli e la
# prova nel browser vero. Se uno dei tre esce con errore, la PR si segna in rosso.
name: Controlli

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node strumenti/controlla.js
      - run: node strumenti/prove.js
      # Playwright e Chromium fuori dal repository (il sito non ha package.json).
      - name: Installa Playwright e Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prova nel browser
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node strumenti/prova-browser.js
