    html{scroll-behavior:smooth}

    .site-header{

      z-index:30;

    }

      display:inline-flex;

      justify-content:center;

      color:#fff;
      font-weight:700;
      font-size:.98rem;
      letter-spacing:.04em;
      text-transform:uppercase;
      transition:.25s ease;
    }

    .book-btn:hover{
      background:var(--sand-dark);
    }

    .header-center{
      display:flex;
      justify-content:center;

      width:100%;
    }

    .brand-block{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      margin-top:2px;
    }

      font-family:'Cormorant Garamond',serif;

      line-height:.88;
      font-weight:500;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

      margin-top:3px;
      font-size:.68rem;
      line-height:1;
      letter-spacing:.30em;
      text-transform:uppercase;
      opacity:.96;
