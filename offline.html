<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline</title>
  <style>
    body{
      font-family:system-ui,sans-serif;
      display:grid;
      place-items:center;
      height:100vh;
      margin:0;
      background:#fffaf5;
      color:#2d1834;
      text-align:center;
      padding:20px;
    }
    .box{max-width:500px}
  </style>
</head>
<body data-i18n-doctitle="offline.title">
  <div class="box">
    <h1 data-i18n="offline.title">Sei offline</h1>
    <p data-i18n="offline.text">La PWA è installata, ma questa pagina non è disponibile senza connessione.</p>
  </div>
  <script src="./i18n.js"></script>
</body>
</html>
